name: Terraform Plan
run-name: ${{ github.workflow }} (${{ github.ref_name }})

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: "write"
  id-token: "write"
  pull-requests: "write"
  issues: "write"

jobs:
  tf_plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.IAM_ROLE_NAME }}
          aws-region: ap-northeast-3

      - name: Get secrets by name and by ARN
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            TF_VAR_*
            TERRAFORM_CLOUD_API_TOKEN
          name-transformation: none

      - uses: hashicorp/setup-terraform@v2
        with:
          cli_config_credentials_token: ${{ env.TERRAFORM_CLOUD_API_TOKEN }}
          terraform_version: 1.13.3

      - name: Terraform fmt
        run: terraform fmt -check
        working-directory: "./terraform"

      - name: debug info
        run: |
          echo "AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:0:1} ${AWS_DEFAULT_REGION#?}"
          echo "AWS_REGION: ${AWS_REGION:0:1} ${AWS_REGION#?}"
          echo "AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:0:1} ${AWS_ACCESS_KEY_ID#?}"
          echo "AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:0:1} ${AWS_SECRET_ACCESS_KEY#?}"
          echo "AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:0:1} ${AWS_SESSION_TOKEN#?}"
          echo "TF_VAR_tailscale_api_key: ${TF_VAR_tailscale_api_key:0:1} ${TF_VAR_tailscale_api_key#?}"
          echo "TF_VAR_tailscale_tailnet: ${TF_VAR_tailscale_tailnet:0:1} ${TF_VAR_tailscale_tailnet#?}"
          echo "TF_VAR_aws_region: ${TF_VAR_aws_region:0:1} ${TF_VAR_aws_region#?}"
          echo "TF_VAR_aws_vpc_cidr: ${TF_VAR_aws_vpc_cidr:0:1} ${TF_VAR_aws_vpc_cidr#?}"
          echo "TF_VAR_aws_vpc_subnet_cidr: ${TF_VAR_aws_vpc_subnet_cidr:0:1} ${TF_VAR_aws_vpc_subnet_cidr#?}"
          echo "TF_VAR_aws_ec2_instance_type: ${TF_VAR_aws_ec2_instance_type:0:1} ${TF_VAR_aws_ec2_instance_type#?}"
          echo "TF_VAR_aws_ec2_server_name: ${TF_VAR_aws_ec2_server_name:0:1} ${TF_VAR_aws_ec2_server_name#?}"
          echo "TF_VAR_aws_ec2_server_private_ip: ${TF_VAR_aws_ec2_server_private_ip:0:1} ${TF_VAR_aws_ec2_server_private_ip#?}"
          echo "TF_VAR_ansible_webhook: ${TF_VAR_ansible_webhook:0:1} ${TF_VAR_ansible_webhook#?}"
          echo "TERRAFORM_CLOUD_API_TOKEN: ${TERRAFORM_CLOUD_API_TOKEN:0:1} ${TERRAFORM_CLOUD_API_TOKEN#?}"

      - run: terraform init
        working-directory: "./terraform"

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: "./terraform"

      # - name: Setup env
      #   run: |
      #     env_json=$(echo "${SECRETS}" | jq -r 'to_entries | .[] | @json')
      #     for i in ${env_json}; do
      #     env_key=$(echo "$i" | jq -r '.key')
      #     env_value=$(echo "$i" | jq -r '.value')
      #     echo "TF_VAR_${env_key,,}=${env_value}" >>"$GITHUB_ENV"
      #     done
      #   env:
      #     SECRETS: ${{ toJson(secrets) }}

      - name: Terraform plan for resources change
        run: terraform plan -input=false -no-color -lock-timeout=10m
        id: tf_plan
        working-directory: "./terraform"

      - name: Comment result to Pull Request
        uses: SoaB1/terraform-pr-commenter@v1.6.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commenter_type: plan
          commenter_input: ${{ format('{0}{1}', steps.tf_plan.outputs.stdout, steps.tf_plan.outputs.stderr) }}
          commenter_exitcode: ${{ steps.tf_plan.outputs.exitcode }}
